# ==============================
# Server Config
# ==============================
server.port=${PORT:8080}

# Comma-separated frontend origins, for example:
# app.cors.allowed-origins=https://your-site.netlify.app
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ==============================
# PostgreSQL / Supabase Database Config
# ==============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/complaint_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# JWT Config
# ==============================
jwt.secret=${JWT_SECRET:change-this-local-secret}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==============================
# Swagger UI
# ==============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
